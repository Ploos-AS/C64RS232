name: KiCad

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal KiCad 9 and headless GUI dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-symbols kicad-footprints \
            xvfb xdotool imagemagick
          kicad-cli version
          command -v eeschema
          command -v Xvfb
          command -v xdotool
          command -v import

      - name: Generate M1.10 electrical and footprint baseline
        run: python3 tools/wire_m1_8.py

      - name: Audit M1.10 physical parts and footprint assignments
        id: m1_10
        run: python3 tools/check_m1_10.py

      - name: Force regeneration of native schematic
        run: rm -f hardware/C64RS232_M1.kicad_sch

      - name: Convert and validate schematic
        id: convert
        continue-on-error: true
        timeout-minutes: 3
        run: |
          chmod +x tools/upgrade_legacy_schematic.sh
          tools/upgrade_legacy_schematic.sh

      - name: Commit generated connected schematics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          legacy='hardware/C64RS232_M1.sch'
          native='hardware/C64RS232_M1.kicad_sch'
          if [ ! -s "$native" ]; then
            echo 'Native schematic absent or empty; nothing to commit.'
            exit 0
          fi
          if git diff --quiet HEAD -- "$legacy" "$native"; then
            echo 'Connected schematics already tracked and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$legacy" "$native"
          git commit -m 'Generate M1.10 KiCad schematic baseline'
          git push origin HEAD:main

      - name: Qualify M1.7 native schematic
        id: m1_7
        if: always()
        run: |
          chmod +x tools/qualify_m1_7.sh
          tools/qualify_m1_7.sh

      - name: Qualify M1.9 electrical nets and ERC
        id: m1_8
        if: always()
        run: |
          chmod +x tools/qualify_m1_8.sh
          tools/qualify_m1_8.sh

      - name: Preserve native schematic for retrieval
        if: always()
        run: |
          if [ -s hardware/C64RS232_M1.kicad_sch ]; then
            mkdir -p build/kicad
            cp hardware/C64RS232_M1.kicad_sch build/kicad/C64RS232_M1.kicad_sch
            echo 'Native schematic preserved in validation artifact.'
          else
            echo 'Native schematic absent or empty.'
          fi

      - name: Upload KiCad validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64rs232-kicad-validation
          path: build/kicad/
          if-no-files-found: warn

      - name: Enforce M1.10 qualification
        if: always()
        run: |
          if [ '${{ steps.m1_10.outcome }}' != 'success' ]; then
            echo 'M1.10 physical-part/footprint qualification failed.'
            exit 1
          fi
          if [ '${{ steps.m1_7.outcome }}' != 'success' ]; then
            echo 'M1.7 runner qualification regressed.'
            exit 1
          fi
          if [ '${{ steps.m1_8.outcome }}' != 'success' ]; then
            echo 'M1.9 electrical-net/ERC qualification failed.'
            exit 1
          fi
          echo 'M1.10 footprint qualification and M1.9 electrical qualification passed.'
          mkdir -p build/kicad
          cat > hardware/M1_10_QUALIFICATION.md <<EOF
# M1.10 Qualification

Status: PASS

Qualified by GitHub Actions on commit ${GITHUB_SHA}.

- M1.10 physical-part and footprint audit: PASS
- M1.7 native schematic regression: PASS
- M1.9 electrical-net/ERC qualification: PASS
- J2 footprint: C64RS232:TE_5747844-4

This file is generated only after all enforced qualification gates pass.
EOF
          cp hardware/M1_10_QUALIFICATION.md build/kicad/M1_10_QUALIFICATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardware/M1_10_QUALIFICATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record M1.10 qualification PASS'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
