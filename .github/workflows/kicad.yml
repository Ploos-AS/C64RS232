name: KiCad

on:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'

permissions:
  contents: write

jobs:
  schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KiCad 9 and headless GUI dependencies
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad xvfb xdotool imagemagick
          kicad-cli version
          command -v eeschema
          command -v Xvfb
          command -v xdotool
          command -v import

      - name: Convert and validate schematic
        id: convert
        continue-on-error: true
        timeout-minutes: 3
        run: |
          chmod +x tools/upgrade_legacy_schematic.sh
          tools/upgrade_legacy_schematic.sh

      - name: Commit native schematic
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -s hardware/C64RS232_M1.kicad_sch ] && ! git ls-files --error-unmatch hardware/C64RS232_M1.kicad_sch >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add hardware/C64RS232_M1.kicad_sch
            git commit -m 'Add native KiCad M1 schematic [skip ci]'
            git push
          else
            echo 'Native schematic absent, empty, or already tracked; nothing to commit.'
          fi

      - name: Upload KiCad validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64rs232-kicad-validation
          path: build/kicad/
          if-no-files-found: warn

      - name: Enforce schematic validation result
        if: always()
        run: |
          if [ '${{ steps.convert.outcome }}' != 'success' ]; then
            echo 'Conversion/validation reported failure. Native conversion output was preserved when available.'
            exit 1
          fi
