name: KiCad

on:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'

jobs:
  schematic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KiCad CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad

      - name: Validate legacy schematic
        run: |
          chmod +x tools/upgrade_legacy_schematic.sh
          tools/upgrade_legacy_schematic.sh

      - name: Run ERC
        run: |
          kicad-cli sch erc hardware/C64RS232_M1.sch \
            --output build/kicad/C64RS232_M1-erc.rpt \
            --exit-code-violations \
            --severity-error

      - name: Upload KiCad validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64rs232-kicad-validation
          path: build/kicad/
          if-no-files-found: warn
