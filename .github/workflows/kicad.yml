name: KiCad

on:
  workflow_dispatch:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'

permissions:
  contents: write

concurrency:
  group: kicad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal KiCad 9 and headless GUI dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints xvfb xdotool imagemagick
          kicad-cli version
          python3 - <<'PY'
          try:
              import pcbnew
              print("pcbnew Python:", pcbnew.GetBuildVersion())
          except Exception as exc:
              print("pcbnew Python unavailable:", repr(exc))
          PY

      - name: Generate M1.10 electrical and footprint baseline
        run: python3 tools/wire_m1_8.py

      - name: Audit M1.10 physical parts and footprint assignments
        run: python3 tools/check_m1_10.py

      - name: Generate M2.1 native PCB baseline
        id: m2_1_generate
        continue-on-error: true
        run: python3 tools/generate_m2_1_pcb.py

      - name: Verify deterministic M2 PCB generation
        run: |
          set -euo pipefail
          first="$(sha256sum hardware/C64RS232.kicad_pcb | awk '{print $1}')"
          python3 tools/generate_m2_1_pcb.py
          second="$(sha256sum hardware/C64RS232.kicad_pcb | awk '{print $1}')"
          echo "first PCB SHA-256:  $first"
          echo "second PCB SHA-256: $second"
          test "$first" = "$second" || { echo "M2 PCB generation is not deterministic"; exit 1; }

      - name: Validate generated PCB with KiCad parser
        run: |
          python3 - <<'PY'
          import pcbnew
          board = pcbnew.LoadBoard("hardware/C64RS232.kicad_pcb")
          footprints = list(board.GetFootprints())
          pad_counts = {fp.GetReference(): len(list(fp.Pads())) for fp in footprints}
          pads = sum(pad_counts.values())
          print("KiCad pcbnew:", pcbnew.GetBuildVersion())
          print("footprints:", len(footprints))
          print("pad counts:", pad_counts)
          print("pads:", pads)
          expected = {"J1":24, "J2":11, "U1":28, "F1":2,
                      "C1":2, "C2":2, "C3":2, "C4":2, "C5":2}
          if len(footprints) != 9:
              raise SystemExit(f"expected 9 footprints, got {len(footprints)}")
          if pad_counts != expected:
              raise SystemExit(f"real footprint pads required: expected {expected}, got {pad_counts}")
          if pads != 75:
              raise SystemExit(f"expected 75 physical pad objects, got {pads}")
          PY

      - name: Qualify real M2 pad net assignments
        run: |
          python3 - <<'PY'
          import pcbnew
          board = pcbnew.LoadBoard("hardware/C64RS232.kicad_pcb")
          expected = {
              "J1": {"2":"RAW_5V","A":"GND","N":"GND","B":"C64_RXD","C":"C64_RXD","D":"C64_RTS","E":"C64_DTR","F":"C64_RI","H":"C64_DCD","K":"C64_CTS","L":"C64_DSR","M":"C64_TXD"},
              "J2": {"1":"RS232_DCD","2":"RS232_RXD","3":"RS232_TXD","4":"RS232_DTR","5":"GND","6":"RS232_DSR","7":"RS232_RTS","8":"RS232_CTS","9":"RS232_RI"},
              "F1": {"1":"RAW_5V","2":"+5V"},
              "U1": {"1":"C2_PLUS","2":"C2_MINUS","3":"VMINUS","4":"RS232_RXD","5":"RS232_CTS","6":"RS232_DSR","7":"RS232_DCD","8":"RS232_RI",
                     "9":"RS232_TXD","10":"RS232_RTS","11":"RS232_DTR","12":"C64_DTR","13":"C64_RTS","14":"C64_TXD","15":"C64_RI","16":"C64_DCD",
                     "17":"C64_DSR","18":"C64_CTS","19":"C64_RXD","22":"+5V","23":"+5V","24":"C1_MINUS","25":"GND","26":"+5V","27":"VPLUS","28":"C1_PLUS"},
              "C1": {"1":"C1_PLUS","2":"C1_MINUS"},
              "C2": {"1":"C2_PLUS","2":"C2_MINUS"},
              "C3": {"1":"VPLUS","2":"GND"},
              "C4": {"1":"VMINUS","2":"GND"},
              "C5": {"1":"+5V","2":"GND"},
          }
          refs = {fp.GetReference(): fp for fp in board.GetFootprints()}
          errors = []
          for ref, pins in expected.items():
              pads = {p.GetNumber(): p.GetNetname() for p in refs[ref].Pads()}
              for pin, net in pins.items():
                  if pads.get(pin) != net:
                      errors.append(f"{ref}/{pin}: expected {net}, got {pads.get(pin)!r}")
          for pin in ("10","11"):
              pad = next(p for p in refs["J1"].Pads() if p.GetNumber() == pin)
              if pad.GetNetname():
                  errors.append(f"J1/{pin}: 9VAC must be unconnected, got {pad.GetNetname()}")
          for pin in ("20","21"):
              pad = next(p for p in refs["U1"].Pads() if p.GetNumber() == pin)
              if pad.GetNetname():
                  errors.append(f"U1/{pin}: frozen NC pin must be unconnected, got {pad.GetNetname()}")
          if errors:
              raise SystemExit("M2 physical net gate FAIL:\n" + "\n".join(errors))
          print("M2 physical pad-net gate PASS")
          PY

      - name: Report physical pad coordinates
        run: |
          python3 - <<'PY'
          import pcbnew
          board = pcbnew.LoadBoard("hardware/C64RS232.kicad_pcb")
          for fp in board.GetFootprints():
              if fp.GetReference() in {"J1","F1","U1","C1","C2","C3","C4","C5","J2"}:
                  for pad in fp.Pads():
                      if pad.GetNetname():
                          p = pad.GetPosition()
                          print(f"{fp.GetReference()}/{pad.GetNumber()} {pad.GetNetname()} {pcbnew.ToMM(p.x):.4f} {pcbnew.ToMM(p.y):.4f}")
          PY

      # Native KiCad DRC below is authoritative for copper connectivity.
      # The former endpoint-only custom copper graph gate was removed because
      # it could report false disconnects across valid KiCad copper constructs.

      - name: Qualify M2.1 PCB structure
        run: python3 tools/check_m2_1.py

      - name: Qualify M2.3 C64 User Port mapping
        run: python3 tools/check_m2_3_j1.py

      - name: Qualify M2.2 power and charge-pump copper
        run: python3 tools/check_m2_2.py

      - name: Report M2 mechanical anchors
        run: |
          python3 - <<'PY'
          import pcbnew
          board = pcbnew.LoadBoard("hardware/C64RS232.kicad_pcb")
          for fp in board.GetFootprints():
              if fp.GetReference() in {"J1","J2"}:
                  p = fp.GetPosition()
                  print(fp.GetReference(), fp.GetFPID().GetLibItemName(), pcbnew.ToMM(p.x), pcbnew.ToMM(p.y))
          PY

      - name: Qualify M2.4 mechanical baseline
        run: |
          python3 tools/check_m2_4.py

      - name: Record deterministic PCB fingerprint
        run: |
          set -euo pipefail
          sha256sum tools/generate_m2_1_pcb.py hardware/C64RS232.kicad_pcb
          kicad-cli version

      - name: Run native KiCad PCB DRC
        run: |
          set +e
          kicad-cli pcb drc --exit-code-violations -o hardware/C64RS232-drc.rpt hardware/C64RS232.kicad_pcb
          rc=$?
          set -e
          cat hardware/C64RS232-drc.rpt
          exit $rc

      - name: Qualify M2.3 signal routing and GND plane
        run: python3 tools/check_m2_3.py
      - name: Upload M2.1 GUI diagnostics
        if: steps.m2_1_generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m2-1-kicad-gui-diagnostics
          path: hardware/m2_1_after_f8.png
          if-no-files-found: warn

      - name: Enforce M2.1 generation result
        if: steps.m2_1_generate.outcome == 'failure'
        run: exit 1

      - name: Record M2.1 qualification evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p qualification
          printf '%s\n' '# M2.1 Qualification' '' 'Status: PASS' '' "Qualified by GitHub Actions on source commit ${GITHUB_SHA}." '' '- Native KiCad PCB generation: PASS' '- M2.1 structural PCB qualification: PASS' '- 2 copper layers; 1.57 mm nominal PCB' '- Nine frozen M1.10 footprints present exactly once' '- Closed provisional Edge.Cuts and J1/J2 mechanical anchors: PASS' '- Routing and copper zones intentionally deferred to M2.2/M2.3' > qualification/M2_1_QUALIFICATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/M2_1_QUALIFICATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record M2.1 qualification PASS'
            git push origin HEAD:main
          fi

      - name: Qualify M1.7 native schematic
        run: |
          chmod +x tools/qualify_m1_7.sh
          tools/qualify_m1_7.sh

      - name: Qualify M1.9 electrical nets and ERC
        run: |
          chmod +x tools/qualify_m1_8.sh
          tools/qualify_m1_8.sh

      - name: Record M1.10 qualification evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p qualification
          printf '%s\n'             '# M1.10 Qualification'             ''             'Status: PASS'             ''             "Qualified by GitHub Actions on source commit ${GITHUB_SHA}."             ''             '- M1.10 physical-part and footprint audit: PASS'             '- M1.7 native schematic regression: PASS'             '- M1.9 electrical-net/ERC qualification: PASS'             '- J2 footprint: C64RS232:TE_5747844-4'             > qualification/M1_10_QUALIFICATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/M1_10_QUALIFICATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record M1.10 qualification PASS'
            git push origin HEAD:main
          fi
