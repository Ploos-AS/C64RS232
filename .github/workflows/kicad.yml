name: KiCad

on:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'

permissions:
  contents: write

jobs:
  schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KiCad 9 and headless GUI dependencies
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad xvfb xdotool imagemagick
          kicad-cli version
          command -v eeschema
          command -v Xvfb
          command -v xdotool
          command -v import

      - name: Convert and validate schematic
        id: convert
        continue-on-error: true
        timeout-minutes: 3
        run: |
          chmod +x tools/upgrade_legacy_schematic.sh
          tools/upgrade_legacy_schematic.sh

      - name: Commit generated native schematic
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          native='hardware/C64RS232_M1.kicad_sch'
          if [ ! -s "$native" ]; then
            echo 'Native schematic absent or empty; nothing to commit.'
            exit 0
          fi

          # Avoid a second workflow run: commits made with GITHUB_TOKEN do not
          # recursively trigger push workflows. Commit only when content differs.
          if git cat-file -e "HEAD:$native" 2>/dev/null && git diff --quiet HEAD -- "$native"; then
            echo 'Native schematic already tracked and unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$native"
          git commit -m 'Add generated native KiCad M1 schematic'
          git push origin HEAD:main

      - name: Preserve native schematic for retrieval
        if: always()
        run: |
          if [ -s hardware/C64RS232_M1.kicad_sch ]; then
            mkdir -p build/kicad
            cp hardware/C64RS232_M1.kicad_sch build/kicad/C64RS232_M1.kicad_sch
            echo 'Native schematic preserved in validation artifact.'
          else
            echo 'Native schematic absent or empty.'
          fi

      - name: Upload KiCad validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64rs232-kicad-validation
          path: build/kicad/
          if-no-files-found: warn

      - name: Enforce schematic validation result
        if: always()
        run: |
          if [ '${{ steps.convert.outcome }}' != 'success' ]; then
            echo 'Conversion/validation reported failure. Native conversion output was preserved when available.'
            exit 1
          fi
