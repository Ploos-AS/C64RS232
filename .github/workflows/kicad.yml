name: KiCad

on:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'

permissions:
  contents: write

jobs:
  schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal KiCad 9 and headless GUI dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          # Avoid the kicad meta-package: it pulls demos, documentation and the
          # ~280 MB 3D model archive, none of which is needed for schematic CI.
          sudo apt-get install -y --no-install-recommends \
            kicad-cli kicad-symbols kicad-footprints \
            xvfb xdotool imagemagick
          kicad-cli version
          command -v eeschema
          command -v Xvfb
          command -v xdotool
          command -v import

      - name: Generate M1.9 electrical connectivity
        run: python3 tools/wire_m1_8.py

      - name: Force regeneration of native schematic
        run: rm -f hardware/C64RS232_M1.kicad_sch

      - name: Convert and validate schematic
        id: convert
        continue-on-error: true
        timeout-minutes: 3
        run: |
          chmod +x tools/upgrade_legacy_schematic.sh
          tools/upgrade_legacy_schematic.sh

      - name: Commit generated connected schematics
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          legacy='hardware/C64RS232_M1.sch'
          native='hardware/C64RS232_M1.kicad_sch'
          if [ ! -s "$native" ]; then
            echo 'Native schematic absent or empty; nothing to commit.'
            exit 0
          fi
          if git diff --quiet HEAD -- "$legacy" "$native"; then
            echo 'Connected schematics already tracked and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$legacy" "$native"
          git commit -m 'Generate electrically connected KiCad M1.9 schematic'
          git push origin HEAD:main

      - name: Qualify M1.7 native schematic
        id: m1_7
        if: always()
        run: |
          chmod +x tools/qualify_m1_7.sh
          tools/qualify_m1_7.sh

      - name: Qualify M1.9 electrical nets and ERC
        id: m1_8
        if: always()
        run: |
          chmod +x tools/qualify_m1_8.sh
          tools/qualify_m1_8.sh

      - name: Preserve native schematic for retrieval
        if: always()
        run: |
          if [ -s hardware/C64RS232_M1.kicad_sch ]; then
            mkdir -p build/kicad
            cp hardware/C64RS232_M1.kicad_sch build/kicad/C64RS232_M1.kicad_sch
            echo 'Native schematic preserved in validation artifact.'
          else
            echo 'Native schematic absent or empty.'
          fi

      - name: Upload KiCad validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c64rs232-kicad-validation
          path: build/kicad/
          if-no-files-found: warn

      - name: Enforce M1.9 qualification
        if: always()
        run: |
          if [ '${{ steps.m1_7.outcome }}' != 'success' ]; then
            echo 'M1.7 runner qualification regressed.'
            exit 1
          fi
          if [ '${{ steps.m1_8.outcome }}' != 'success' ]; then
            echo 'M1.9 electrical-net/ERC qualification failed.'
            exit 1
          fi
          echo 'M1.9 electrical-net/ERC qualification passed.'
