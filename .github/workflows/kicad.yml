name: KiCad

on:
  workflow_dispatch:
  push:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad.yml'

permissions:
  contents: write

concurrency:
  group: kicad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimal KiCad 9 and headless GUI dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints xvfb xdotool imagemagick
          kicad-cli version

      - name: Generate M1.10 electrical and footprint baseline
        run: python3 tools/wire_m1_8.py

      - name: Audit M1.10 physical parts and footprint assignments
        run: python3 tools/check_m1_10.py

      - name: Generate M2.1 native PCB baseline
        id: m2_1_generate
        continue-on-error: true
        run: python3 tools/generate_m2_1_pcb.py

      - name: Qualify M2.1 PCB structure
        run: python3 tools/check_m2_1.py

      - name: Upload M2.1 GUI diagnostics
        if: steps.m2_1_generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m2-1-kicad-gui-diagnostics
          path: hardware/m2_1_after_f8.png
          if-no-files-found: warn

      - name: Enforce M2.1 generation result
        if: steps.m2_1_generate.outcome == 'failure'
        run: exit 1

      - name: Record M2.1 qualification evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p qualification
          printf '%s\n' '# M2.1 Qualification' '' 'Status: PASS' '' "Qualified by GitHub Actions on source commit ${GITHUB_SHA}." '' '- Native KiCad PCB generation: PASS' '- M2.1 structural PCB qualification: PASS' '- 2 copper layers; 1.57 mm nominal PCB' '- Nine frozen M1.10 footprints present exactly once' '- Closed provisional Edge.Cuts and J1/J2 mechanical anchors: PASS' '- Routing and copper zones intentionally deferred to M2.2/M2.3' > qualification/M2_1_QUALIFICATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/M2_1_QUALIFICATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record M2.1 qualification PASS'
            git push origin HEAD:main
          fi

      - name: Qualify M1.7 native schematic
        run: |
          chmod +x tools/qualify_m1_7.sh
          tools/qualify_m1_7.sh

      - name: Qualify M1.9 electrical nets and ERC
        run: |
          chmod +x tools/qualify_m1_8.sh
          tools/qualify_m1_8.sh

      - name: Record M1.10 qualification evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p qualification
          printf '%s\n'             '# M1.10 Qualification'             ''             'Status: PASS'             ''             "Qualified by GitHub Actions on source commit ${GITHUB_SHA}."             ''             '- M1.10 physical-part and footprint audit: PASS'             '- M1.7 native schematic regression: PASS'             '- M1.9 electrical-net/ERC qualification: PASS'             '- J2 footprint: C64RS232:TE_5747844-4'             > qualification/M1_10_QUALIFICATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/M1_10_QUALIFICATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record M1.10 qualification PASS'
            git push origin HEAD:main
          fi
