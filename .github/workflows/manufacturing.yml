name: Hardware manufacturing package

on:
  workflow_dispatch:
  push:
    tags:
      - "hw-v*"
      - "v*"

permissions:
  contents: write

jobs:
  manufacturing:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
    steps:
      - name: Install packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends git zip findutils coreutils python3 && rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate KiCad PCB
        id: pcb
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t boards < <(find . -type f -name '*.kicad_pcb' -not -path './.git/*' | sort)
          if [ "${#boards[@]}" -eq 0 ]; then
            echo "::error::No .kicad_pcb file found. Manufacturing release is not ready."
            exit 1
          fi
          if [ "${#boards[@]}" -gt 1 ]; then
            echo "::error::Multiple .kicad_pcb files found. Set a project-specific board selection before releasing."
            printf '%s\n' "${boards[@]}"
            exit 1
          fi
          echo "path=${boards[0]}" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "${boards[0]}")" >> "$GITHUB_OUTPUT"
          echo "stem=$(basename "${boards[0]}" .kicad_pcb)" >> "$GITHUB_OUTPUT"


      - name: Maker-friendly design lint
        shell: bash
        run: |
          set -euo pipefail
          pcb="${{ steps.pcb.outputs.path }}"
          python3 - "$pcb" <<'PY'
          import re, sys
          from pathlib import Path
          pcb = Path(sys.argv[1])
          text = pcb.read_text(encoding="utf-8", errors="replace")
          problems = []
          warnings = []

          layers = re.search(r'\(general\s+.*?\(thickness\s+([0-9.]+)\)', text, re.S)
          if layers:
              thickness = float(layers.group(1))
              if not 1.5 <= thickness <= 1.7:
                  warnings.append(f"PCB thickness is {thickness} mm; maker-friendly default is 1.6 mm.")

          copper = re.findall(r'^\s*\(\d+\s+"[^"]+"\s+signal', text, re.M)
          if len(copper) > 2:
              warnings.append(f"Board uses {len(copper)} copper layers; document the multilayer exception in MAKER-FRIENDLY.md.")

          for key, label, preferred in [
              ("clearance", "minimum clearance", 0.20),
              ("track_width", "minimum track width", 0.20),
              ("via_size", "minimum via diameter", 0.60),
              ("via_drill", "minimum via drill", 0.30),
          ]:
              vals = [float(x) for x in re.findall(rf'\({key}\s+([0-9.]+)\)', text)]
              if vals and min(vals) < preferred:
                  warnings.append(f"{label} {min(vals):.3f} mm is below maker-friendly preference {preferred:.2f} mm.")

          if "MAKER-FRIENDLY.md" not in [p.name for p in Path(".").iterdir()]:
              problems.append("MAKER-FRIENDLY.md is missing.")

          if not re.search(r'\(footprint\s+', text):
              warnings.append("No footprints detected; verify that this is an intentional pre-layout board.")

          for msg in warnings:
              print(f"::warning::{msg}")
          for msg in problems:
              print(f"::error::{msg}")
          if problems:
              sys.exit(1)
          print("Maker-friendly lint completed. Preference deviations are warnings and require documented review.")
          PY

      - name: Run KiCad DRC
        run: |
          mkdir -p build/manufacturing/reports
          kicad-cli pcb drc --exit-code-violations --output build/manufacturing/reports/drc.rpt "${{ steps.pcb.outputs.path }}"

      - name: Export Gerbers and drill files
        run: |
          set -euo pipefail
          out=build/manufacturing/gerbers
          mkdir -p "$out"
          kicad-cli pcb gerbers --output "$out/" "${{ steps.pcb.outputs.path }}"
          kicad-cli pcb drill --output "$out/" "${{ steps.pcb.outputs.path }}"

      - name: Export BOM and placement data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/manufacturing
          sch="${{ steps.pcb.outputs.dir }}/${{ steps.pcb.outputs.stem }}.kicad_sch"
          if [ -f "$sch" ]; then
            kicad-cli sch export bom --output build/manufacturing/BOM.csv "$sch"
          else
            echo "::warning::Matching KiCad schematic not found; BOM not generated."
          fi
          kicad-cli pcb pos --format csv --units mm --output build/manufacturing/CPL.csv "${{ steps.pcb.outputs.path }}"


      - name: Maker-friendly BOM lint
        shell: bash
        run: |
          set -euo pipefail
          bom="build/manufacturing/BOM.csv"
          if [ ! -f "$bom" ]; then
            echo "::warning::BOM.csv was not generated; BOM structural qualification is pending."
            exit 0
          fi
          python3 - "$bom" <<'PY'
          import csv, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          rows = list(csv.DictReader(path.open(encoding="utf-8-sig", newline="")))
          if not rows:
              print("::error::BOM is empty.")
              raise SystemExit(1)

          fields = {f.strip().lower(): f for f in (rows[0].keys() if rows else []) if f}
          def find(*names):
              for n in names:
                  if n in fields:
                      return fields[n]
              return None

          ref = find("reference", "references", "ref", "refdes", "designator")
          value = find("value", "description")
          footprint = find("footprint", "package")
          mpn = find("mpn", "manufacturer part number", "manufacturer_part_number")
          manufacturer = find("manufacturer", "mfr")

          errors = []
          warnings = []
          if not ref: errors.append("BOM lacks a reference-designator column.")
          if not value: errors.append("BOM lacks a value/description column.")
          if not footprint: warnings.append("BOM lacks footprint/package information.")
          if not mpn: warnings.append("BOM lacks an MPN column; critical-part MPN review is required.")
          if not manufacturer: warnings.append("BOM lacks a manufacturer column; critical-part manufacturer review is required.")

          def blank_count(column):
              if not column: return 0
              return sum(1 for r in rows if not (r.get(column) or "").strip())

          if ref and blank_count(ref): errors.append(f"{blank_count(ref)} BOM row(s) have no reference designator.")
          if value and blank_count(value): warnings.append(f"{blank_count(value)} BOM row(s) have no value/description.")
          if footprint and blank_count(footprint): warnings.append(f"{blank_count(footprint)} BOM row(s) have no footprint/package.")
          if mpn and blank_count(mpn): warnings.append(f"{blank_count(mpn)} BOM row(s) have no MPN; verify whether they are freely substitutable.")
          if manufacturer and blank_count(manufacturer): warnings.append(f"{blank_count(manufacturer)} BOM row(s) have no manufacturer.")

          for msg in warnings: print(f"::warning::{msg}")
          for msg in errors: print(f"::error::{msg}")
          if errors: raise SystemExit(1)
          print(f"Maker-friendly BOM lint passed structural checks for {len(rows)} BOM row(s).")
          PY

      - name: Copy manufacturing documentation
        shell: bash
        run: |
          set -euo pipefail
          cp MANUFACTURING.md build/manufacturing/
          cp LICENSE-HARDWARE build/manufacturing/
          for f in README.md; do [ ! -f "$f" ] || cp "$f" build/manufacturing/; done

      - name: Create checksums and archive
        shell: bash
        run: |
          set -euo pipefail
          project="${GITHUB_REPOSITORY#*/}"
          version="${GITHUB_REF_NAME:-manual}"
          package="${project}-${version}-manufacturing"
          (
            cd build/manufacturing
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          (cd build && mv manufacturing "$package" && zip -r "$package.zip" "$package")
          echo "PACKAGE=build/$package.zip" >> "$GITHUB_ENV"

      - name: Upload manufacturing artifact
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-package
          path: ${{ env.PACKAGE }}
          if-no-files-found: error


      - name: Generate hardware qualification report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qualification
          python3 <<'PY'
          import json, os
          from pathlib import Path

          root = Path(".")
          pcb = sorted(root.glob("**/*.kicad_pcb"))
          sch = sorted(root.glob("**/*.kicad_sch"))
          required_docs = [
              "MANUFACTURING.md", "MAKER-FRIENDLY.md", "COMPONENT-POLICY.md",
              "MANUFACTURER-PROFILES.md", "ORDERING.md",
              "HARDWARE-RELEASE-CHECKLIST.md", "LICENSE-HARDWARE",
              "LICENSE-SOFTWARE", "README.md",
          ]
          docs_ok = all((root / p).is_file() for p in required_docs)
          package_dir = root / "build" / "manufacturing"
          gerbers = list(package_dir.glob("gerbers/*")) if package_dir.exists() else []
          bom = package_dir / "BOM.csv"
          cpl = package_dir / "CPL.csv"

          gates = {
              "design_identity": {
                  "status": "PASS" if len(pcb) == 1 else "PENDING",
                  "evidence": {"pcb_count": len(pcb), "schematic_count": len(sch)}
              },
              "electrical_design": {
                  "status": "PENDING",
                  "evidence": "Final status depends on DRC/ERC and documented engineering review."
              },
              "components_bom": {
                  "status": "PASS" if bom.is_file() else "PENDING",
                  "evidence": {"bom_generated": bom.is_file()}
              },
              "maker_accessibility": {
                  "status": "PENDING",
                  "evidence": "Requires human review of assembly, testability, repairability and exceptions."
              },
              "manufacturing_package": {
                  "status": "PASS" if gerbers and cpl.is_file() else "PENDING",
                  "evidence": {"gerber_outputs": len(gerbers), "cpl_generated": cpl.is_file()}
              },
              "documentation": {
                  "status": "PASS" if docs_ok else "PENDING",
                  "evidence": {"required_docs_present": docs_ok}
              },
              "ordering": {
                  "status": "PENDING",
                  "evidence": "Manufacturer links/settings require release-specific validation."
              },
              "licensing_provenance": {
                  "status": "PASS" if (root/"LICENSE-HARDWARE").is_file() and (root/"LICENSE-SOFTWARE").is_file() else "PENDING",
                  "evidence": "Licence files checked structurally; third-party provenance remains a release review item."
              },
          }
          statuses = [g["status"] for g in gates.values()]
          overall = "FAIL" if "FAIL" in statuses else ("PASS" if all(x == "PASS" for x in statuses) else "PENDING")
          report = {
              "schema": "ploos-hardware-qualification-v1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "revision": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF_NAME"),
              "overall_status": overall,
              "gates": gates,
          }
          out = root/"build"/"qualification"
          (out/"hardware-qualification.json").write_text(json.dumps(report, indent=2)+"\n")
          lines = [
              "# Hardware Qualification Report", "",
              f"- Repository: `{report['repository']}`",
              f"- Revision: `{report['revision']}`",
              f"- Ref: `{report['ref']}`",
              f"- Overall: **{overall}**", "",
              "| Gate | Status |", "| --- | --- |",
          ]
          for name, gate in gates.items():
              lines.append(f"| {name.replace('_',' ').title()} | **{gate['status']}** |")
          lines += ["", "PENDING means that mandatory evidence or human engineering review is still required.",
                    "A generated report does not upgrade PENDING gates to PASS without evidence.", ""]
          (out/"hardware-qualification.md").write_text("\n".join(lines))
          print((out/"hardware-qualification.md").read_text())
          PY

      - name: Upload hardware qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-qualification
          path: build/qualification/
          if-no-files-found: error

      - name: Publish manufacturing package on GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE" --clobber
          else
            gh release create "$tag" "$PACKAGE" \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
